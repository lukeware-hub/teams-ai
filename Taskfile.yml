# https://taskfile.dev - run `task` to list every command.
version: '3'

tasks:
  default:
    desc: List all tasks
    silent: true
    cmds:
      - task --list

  # ---- Docker platform (recommended) ----
  setup:
    desc: Create .env from .env.example if it does not exist
    status:
      - test -f .env
    cmds:
      - cp .env.example .env

  pull:
    internal: true
    cmds:
      - docker compose pull --ignore-pull-failures

  up:
    desc: Pull the prebuilt image (build it when the pull fails) and start the whole platform (UI on http://localhost:8787)
    deps: [setup]
    cmds:
      - task: pull
      - docker compose up -d

  up:source:
    desc: Build the image from the source in this folder and start the platform (for developing Teams AI)
    deps: [setup]
    env:
      TEAMS_AI_IMAGE: teams-ai:local
    cmds:
      - docker compose up -d --build

  guia:grafo:
    desc: Rebuild the graph of docs/guia (the chat searches it) with the platform's graphify and Claude login; run after editing the guide
    cmds:
      - sh scripts/guia/atualizar-grafo.sh

  doctor:
    desc: Check the prerequisites and say how to fix what is missing (messages in pt-br)
    silent: true
    cmds:
      - task: doctor:docker
      - task: doctor:daemon
      - task: doctor:compose
      - echo "Tudo certo. Rode 'task start' para subir o Teams AI."

  doctor:docker:
    internal: true
    silent: true
    preconditions:
      - sh: docker --version
        msg: "FALHA: o Docker não está instalado. Instale o Docker Desktop (winget install --id Docker.DockerDesktop -e) e abra um novo terminal."

  doctor:daemon:
    internal: true
    silent: true
    preconditions:
      - sh: docker info
        msg: "FALHA: o Docker está instalado, mas parado. Abra o Docker Desktop e espere aparecer 'Engine running'."

  doctor:compose:
    internal: true
    silent: true
    preconditions:
      - sh: docker compose version
        msg: "FALHA: o 'docker compose' (v2) não foi encontrado. Atualize o Docker Desktop."

  start:
    desc: Check prerequisites, start the platform, wait until it is healthy and open the UI
    cmds:
      - task: doctor
      - task: setup
      - task: pull
      - docker compose up -d --wait
      - echo "Teams AI no ar em http://localhost:8787"
      - cmd: cmd.exe /c start "" http://localhost:8787
        platforms: [windows]
        ignore_error: true
      - cmd: open http://localhost:8787
        platforms: [darwin]
        ignore_error: true
      - cmd: xdg-open http://localhost:8787
        platforms: [linux]
        ignore_error: true

  down:
    desc: Stop the platform (keeps data, logins and workspaces)
    cmds:
      - docker compose down

  restart:
    desc: Restart the orchestrator container
    cmds:
      - docker compose restart teams-ai

  ps:
    desc: Show service status and health
    cmds:
      - docker compose ps

  logs:
    desc: Follow the orchestrator logs
    cmds:
      - docker compose logs -f teams-ai

  logs:dind:
    desc: Follow the nested Docker daemon logs
    cmds:
      - docker compose logs -f dind

  # ---- License service (admin UI on http://localhost:8790) ----
  license:up:
    desc: Build and start the license service and its PostgreSQL database
    preconditions:
      - sh: test -f license/.env
        msg: 'Create license/.env with LICENSE_MASTER_KEY, LICENSE_SIGNING_KEY, LICENSE_CLIENT_PRIVATE_KEY, JWT_SECRET, ADMIN_EMAIL and ADMIN_PASSWORD first.'
    cmds:
      - docker compose up -d --build --wait postgres license
      - echo "Serviço de licenças no ar em http://localhost:8790"

  license:down:
    desc: Stop the license service and its database (keeps the licenses)
    cmds:
      - docker compose stop license postgres

  license:restart:
    desc: Restart the license service
    cmds:
      - docker compose restart license

  license:logs:
    desc: Follow the license service logs
    cmds:
      - docker compose logs -f license

  license:psql:
    desc: Open a PostgreSQL shell on the license database
    interactive: true
    cmds:
      - docker compose exec postgres psql -U license -d license

  license:test:
    desc: License service Go tests
    dir: license
    cmds:
      - go test ./...

  license:web:install:
    desc: Install the license admin UI dependencies
    dir: license/web
    cmds:
      - npm ci

  license:web:build:
    desc: Type-check and build the license admin UI
    dir: license/web
    cmds:
      - npm run build

  license:web:dev:
    desc: Next.js dev server for the license admin UI
    dir: license/web
    cmds:
      - npm run dev

  license:rebuild:
    desc: Rebuild the license service and Teams AI so both pick up the latest code and .env
    cmds:
      - docker compose up -d --build --wait postgres license teams-ai

  shell:
    desc: Open a shell inside the orchestrator container
    interactive: true
    cmds:
      - docker compose exec teams-ai bash

  login:claude:
    desc: Log in to Claude Code inside the container
    interactive: true
    cmds:
      - docker compose exec teams-ai claude auth login

  login:gh:
    desc: Log in to GitHub CLI inside the container
    interactive: true
    cmds:
      - docker compose exec teams-ai gh auth login

  cli:
    desc: 'Run the teams-ai CLI in the container, e.g. task cli -- status --project <dir> --run <id>'
    cmds:
      - docker compose exec teams-ai npm run teams-ai -- {{.CLI_ARGS}}

  backup:
    desc: Save the data, Claude and GitHub volumes to backups/<date> (the platform must be stopped; run `task down` first)
    vars:
      PROJECT:
        sh: echo "${COMPOSE_PROJECT_NAME:-$(basename "$PWD" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9_-')}"
      STAMP:
        sh: date +%Y%m%d-%H%M%S
    preconditions:
      - sh: test -z "$(docker compose ps -q)"
        msg: 'The platform is running: run `task down` first so no file changes during the copy.'
    cmds:
      - umask 077 && mkdir -p backups/{{.STAMP}} && chmod 700 backups backups/{{.STAMP}}
      - |
        set -e
        for pair in teams-ai-data:teams-ai-data teams-ai-claude:{{.PROJECT}}_teams-ai-claude teams-ai-gh:{{.PROJECT}}_teams-ai-gh teams-ai-license:teams-ai-license; do
          docker run --rm -v "${pair#*:}":/data:ro -v "$PWD/backups/{{.STAMP}}":/backup alpine tar czf "/backup/${pair%%:*}.tar.gz" -C /data .
        done
      - echo "Backup saved in backups/{{.STAMP}}"

  restore:
    desc: 'Replace the data, Claude and GitHub volumes with a backup: task restore DIR=backups/<date> FORCE=yes (stopped platform only)'
    vars:
      PROJECT:
        sh: echo "${COMPOSE_PROJECT_NAME:-$(basename "$PWD" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9_-')}"
    preconditions:
      - sh: test -n "{{.DIR}}" && test -d "{{.DIR}}"
        msg: 'Pass the backup folder: task restore DIR=backups/<date> FORCE=yes'
      - sh: test "{{.FORCE}}" = yes
        msg: 'Restore deletes the current content of the volumes: add FORCE=yes to confirm.'
      - sh: test -z "$(docker compose ps -q)"
        msg: 'The platform is running: run `task down` first.'
    cmds:
      - |
        set -e
        for pair in teams-ai-data:teams-ai-data teams-ai-claude:{{.PROJECT}}_teams-ai-claude teams-ai-gh:{{.PROJECT}}_teams-ai-gh teams-ai-license:teams-ai-license; do
          docker run --rm -v "${pair#*:}":/data -v "$PWD/{{.DIR}}":/backup:ro alpine sh -c "find /data -mindepth 1 -delete && tar xzf /backup/${pair%%:*}.tar.gz -C /data"
        done
      - echo "Restored from {{.DIR}}. Run 'task start' to bring the platform back."

  reset:
    desc: DELETE all containers, volumes, logins and workspaces
    prompt: This removes ALL teams-ai data, including Claude and GitHub logins. Continue?
    cmds:
      - docker compose down -v

  # ---- Development (run inside WSL2 Ubuntu or any Linux, see README) ----
  install:
    desc: Install backend and web dependencies
    cmds:
      - npm ci
      - npm run web:install

  ui:
    desc: Start the UI and API from source on port 8787
    cmds:
      - npm run ui -- --port 8787

  web:dev:
    desc: Vite dev server for the web UI
    cmds:
      - npm run web:dev

  web:build:
    desc: Type-check and build the web UI
    cmds:
      - npm run web:build

  typecheck:
    desc: TypeScript check
    cmds:
      - npm run typecheck

  test:
    desc: Backend tests
    cmds:
      - npm test

  test:web:
    desc: Web UI tests
    cmds:
      - npm run test:web

  check:
    desc: What CI runs - typecheck, backend tests, web tests, web build
    cmds:
      - task: typecheck
      - task: test
      - task: test:web
      - task: web:build

  wsl:setup:
    desc: Install the toolchain on Ubuntu (WSL2)
    cmds:
      - bash scripts/wsl/setup-ubuntu.sh

  wsl:check:
    desc: Report which tools are installed (JSON)
    cmds:
      - bash scripts/wsl/check-tools.sh
