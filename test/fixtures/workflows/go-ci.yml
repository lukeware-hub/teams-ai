name: ci
on:
  push:
    branches:
      - main
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install
        run: go mod download
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Lint
        run: go vet ./...
      - name: Typecheck
        run: go build ./...
      - name: Unit tests
        run: gotestsum --junitfile reports/junit.xml ./...
      - name: Build
        run: go build -o app .
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
