name: image-rescan
on:
  schedule:
    - cron: 0 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  rescan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/todo-api
          tags: |
            type=raw,value=latest
      - name: Pull the image
        run: docker pull "$IMAGE"
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
      - name: Scan the image
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/work -w /work aquasec/trivy:0.75.0 image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
      - name: List the image components
        if: always()
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/work -w /work aquasec/trivy:0.75.0 image --format cyclonedx --output sbom.cdx.json "$IMAGE"
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
      - name: Keep the SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Open an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: "await github.rest.issues.create({ ...context.repo, title: 'Image scan failed', body: `The weekly scan of the published image failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });"
