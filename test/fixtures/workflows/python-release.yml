name: release
on:
  push:
    branches:
      - main
    tags:
      - v*
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/py-api
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest
      - name: Build to scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: image-scan:local
      - name: Scan the image
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/work -w /work aquasec/trivy:0.75.0 image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"
        env:
          IMAGE: image-scan:local
      - name: List the image components
        if: always()
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/work -w /work aquasec/trivy:0.75.0 image --format cyclonedx --output sbom.cdx.json "$IMAGE"
        env:
          IMAGE: image-scan:local
      - name: Keep the SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
