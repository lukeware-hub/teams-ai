apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: hello-app }
  template:
    metadata:
      labels: { app: hello-app }
    spec:
      containers:
        - name: app
          image: {{IMAGE}}
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          envFrom: [{ secretRef: { name: hello-app-secrets, optional: true } }]
          readinessProbe: { httpGet: { path: /health, port: 3000 }, periodSeconds: 2 }
---
apiVersion: v1
kind: Service
metadata:
  name: hello-app
spec:
  selector: { app: hello-app }
  type: NodePort
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30080 }]
