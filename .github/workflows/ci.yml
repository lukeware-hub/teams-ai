name: CI

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run backend tests
        run: npm test

      - name: Check the backend test time budget
        if: always()
        run: npm run test:budget

      - name: Install web dependencies
        run: npm run web:install

      - name: Run web tests
        run: npm run test:web

      - name: Build web UI
        run: npm run web:build

  publish:
    needs: quality
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      TRIVY_IMAGE: aquasec/trivy:0.75.0
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - name: Name the image in lower case
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image under the git tag
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Scan for critical vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src:ro" "$TRIVY_IMAGE" image --severity CRITICAL --ignore-unfixed --secret-config /src/trivy-secret.yaml --exit-code 1 "$IMAGE:$GITHUB_REF_NAME"

      - name: Publish the git tag and latest
        run: |
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker tag "$IMAGE:$GITHUB_REF_NAME" "$IMAGE:latest"
          docker push "$IMAGE:latest"

  report:
    needs: [quality, publish]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Write the status of every job and step
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "## CI report: $GITHUB_REF_NAME ($GITHUB_SHA)"
            echo ""
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --paginate --jq '.jobs[] | select(.name != "report") | "### \(.name): \(.conclusion // .status)\n" + ([.steps[]? | "- \(.name): \(.conclusion // .status)"] | join("\n")) + "\n"'
          } >> "$GITHUB_STEP_SUMMARY"
