name: CI

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run backend tests
        run: npm test

      - name: Install web dependencies
        run: npm run web:install

      - name: Run web tests
        run: npm run test:web

      - name: Build web UI
        run: npm run web:build

  publish:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      TRIVY_IMAGE: aquasec/trivy:0.75.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - name: Name the image in lower case
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image under the git tag
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Scan for critical vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src:ro" "$TRIVY_IMAGE" image --severity CRITICAL --ignore-unfixed --secret-config /src/trivy-secret.yaml --exit-code 1 "$IMAGE:$GITHUB_REF_NAME"

      - name: Publish the git tag and latest
        run: |
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker tag "$IMAGE:$GITHUB_REF_NAME" "$IMAGE:latest"
          docker push "$IMAGE:latest"
