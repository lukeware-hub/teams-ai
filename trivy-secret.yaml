# Secret scan allowlist for the image scan in CI.
# The cybersecurity-skills adapters quote secret patterns and redacted placeholders as examples.
allow-rules:
  - id: cybersecurity-skills-adapter-examples
    description: Example secret patterns in the pinned cybersecurity-skills cursor adapters.
    path: '(^|/)cybersecurity-skills/[^/]+/adapters/cursor/(owasp|secrets)-audit\.mdc$'
