apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omniroute-data
  namespace: teams-ai
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniroute
  namespace: teams-ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: omniroute }
  template:
    metadata:
      labels: { app: omniroute }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: omniroute
          # Pin to the release scripts/wsl/omniroute/up.sh uses (OMNIROUTE_VERSION).
          image: diegosouzapw/omniroute:4.12.0
          # Root filesystem stays writable: the image's write paths outside /app/data are not verified.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ['ALL'] }
          ports:
            - { name: http, containerPort: 20128 }
          envFrom:
            - secretRef: { name: omniroute-secrets, optional: true }
            - secretRef: { name: openrouter-api-key, optional: true }
            - secretRef: { name: gemini-api-key, optional: true }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /app/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: omniroute-data }
---
apiVersion: v1
kind: Service
metadata:
  name: omniroute
  namespace: teams-ai
spec:
  selector: { app: omniroute }
  ports:
    - { name: http, port: 20128, targetPort: http }
