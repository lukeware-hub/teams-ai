# Rootless BuildKit daemon + registry: image builds without a Docker daemon (plan 14).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: teams-ai
spec:
  replicas: 1
  selector:
    matchLabels: { app: buildkitd }
  template:
    metadata:
      labels: { app: buildkitd }
      annotations:
        container.apparmor.security.beta.kubernetes.io/buildkitd: unconfined
    spec:
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.17.2-rootless
          args:
            - --addr
            - unix:///run/user/1000/buildkit/buildkitd.sock
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
          ports:
            - { name: grpc, containerPort: 1234 }
          readinessProbe:
            exec: { command: ['buildctl', 'debug', 'workers'] }
            periodSeconds: 10
          securityContext:
            seccompProfile: { type: Unconfined }
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - { name: state, mountPath: /home/user/.local/share/buildkit }
      volumes:
        - name: state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: teams-ai
spec:
  selector: { app: buildkitd }
  ports:
    - { name: grpc, port: 1234, targetPort: grpc }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: teams-ai
spec:
  replicas: 1
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - { name: http, containerPort: 5000 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: teams-ai
spec:
  selector: { app: registry }
  ports:
    - { name: http, port: 5000, targetPort: http }
