apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teams-ai
  namespace: teams-ai
spec:
  ingressClassName: nginx
  rules:
    - host: teams-ai.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
