apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # kind has no LoadBalancer: expose the UI on a host-mapped NodePort (kind config extraPortMappings 30787 -> 8787).
  - target: { kind: Service, name: backend }
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30787
