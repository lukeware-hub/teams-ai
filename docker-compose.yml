# The whole platform in one container: orchestrator, API and web UI on http://localhost:8787.
# Gates and docker-local deploys run as sibling containers on the host daemon through the mounted socket; the daemon
# cannot see this container's paths, so docker/config.json (seeded on first start) rewrites ~/.teams-ai to the data volume.
# Put TEAMS_AI_UI_TOKEN in .env (see .env.example).
services:
  teams-ai:
    build: .
    image: teams-ai:local
    ports:
      - '127.0.0.1:8787:8787'
    environment:
      TEAMS_AI_UI_TOKEN: ${TEAMS_AI_UI_TOKEN:?set TEAMS_AI_UI_TOKEN in .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    # The bwrap sandbox of each agent step needs user namespaces, which Docker's default profiles block.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    # Lets the non-root `node` user use the docker socket: gid 0 on Docker Desktop, the `docker` gid on Linux.
    group_add:
      - '${DOCKER_GID:-0}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - teams-ai-data:/home/node/.teams-ai
      - teams-ai-claude:/home/node/.claude
      - teams-ai-gh:/home/node/.config/gh

volumes:
  teams-ai-data:
    name: teams-ai-data
  teams-ai-claude:
  teams-ai-gh:
