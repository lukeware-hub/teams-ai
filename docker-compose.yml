# The whole platform: orchestrator, API and web UI on http://localhost:8787, plus a rootless Docker daemon (`dind`).
# Gates and docker-local deploys run as containers of the nested daemon, never on the host daemon (audit H4): what an
# agent writes (Dockerfile, docker-compose.yml, gate image) cannot reach the host. The data volume is mounted at the same
# path in both containers, so a bind source the orchestrator names is the same path for the nested daemon.
services:
  teams-ai:
    # The registry image; when it cannot be pulled, `docker compose up` builds this tag from source.
    build: .
    image: ${TEAMS_AI_IMAGE:-ghcr.io/diego-dm-morais/teams-ai:latest}
    # Reaps killed runs: a zombie still looks alive to the run lock and blocks the next run of the spec.
    init: true
    depends_on:
      dind:
        condition: service_healthy
      goproxy:
        condition: service_healthy
      license:
        condition: service_healthy
    ports:
      # Loopback by default; the LAN needs TEAMS_AI_UI_BIND=0.0.0.0 and a TEAMS_AI_UI_TOKEN (both in .env, which git ignores).
      - '${TEAMS_AI_UI_BIND:-127.0.0.1}:8787:8787'
    environment:
      # The port below is published on the host loopback only, so the UI needs no token (server/api/auth.ts).
      TEAMS_AI_UI_LOOPBACK_PUBLISHED: ${TEAMS_AI_UI_LOOPBACK_PUBLISHED:-1}
      TEAMS_AI_ALLOWED_HOSTS: ${TEAMS_AI_ALLOWED_HOSTS:-}
      TEAMS_AI_UI_TOKEN: ${TEAMS_AI_UI_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      DOCKER_HOST: tcp://dind:2375
      TEAMS_AI_GO_PROXY: http://goproxy:8080
      LICENSE_SERVICE_URL: ${LICENSE_SERVICE_URL:-http://license:8080}
      TEAMS_AI_HOST_NAME: ${COMPUTERNAME:-${HOSTNAME:-}}
      TEAMS_AI_HOST_USER: ${USERNAME:-${USER:-}}
      TEAMS_AI_HOST_OS: ${OS:-}
    # The bwrap sandbox of each agent step needs user namespaces and a fresh /proc mount, which Docker's default profiles and masked paths block.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
      - systempaths=unconfined
    cap_drop:
      - ALL
    volumes:
      - teams-ai-data:/home/node/.teams-ai
      - teams-ai-claude:/home/node/.claude
      - teams-ai-gh:/home/node/.config/gh

  # The Go module proxy of the agent sandboxes: proxy.golang.org redirects larger zips to storage.googleapis.com, which a
  # sandbox must never reach, so this service follows the redirect and a Go step reaches only it (server/runner/go-proxy.ts).
  goproxy:
    build: .
    image: ${TEAMS_AI_IMAGE:-ghcr.io/diego-dm-morais/teams-ai:latest}
    init: true
    command: ['npx', 'tsx', '--no-warnings=ExperimentalWarning', 'server/runner/go-proxy.ts']
    cap_drop:
      - ALL
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/').then((r)=>process.exit(r.status===404?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  dind:
    image: docker:27-dind-rootless@sha256:e2ac8e8f66ae21a060b0a8e3005c70f6ed9441aabf409434463d1f6eecd38026
    environment:
      DOCKER_TLS_CERTDIR: ''
    # Rootless dockerd needs user namespaces and /proc writes; it is not `privileged` and has no host socket.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
      - systempaths=unconfined
    # rootlesskit builds its tap device in a user namespace.
    devices:
      - /dev/net/tun
    # The Docker API is reachable only from this compose network.
    expose:
      - '2375'
    # Services a spec deploys (docker-local) listen inside this daemon; the ranges are forwarded to the host loopback so the
    # browser can open them. A plan's deploy.port must fall inside it.
    ports:
      - '127.0.0.1:20000-20099:20000-20099'
      - '127.0.0.1:3000-3019:3000-3019'
    volumes:
      - dind-data:/home/rootless/.local/share/docker
      - teams-ai-data:/home/node/.teams-ai
    healthcheck:
      test: ['CMD', 'docker', '-H', 'tcp://127.0.0.1:2375', 'info']
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine@sha256:1a66d744c1b459e13b05a8fca341da84cb63383e99ce262210efee5a319d4551
    environment:
      POSTGRES_USER: license
      POSTGRES_PASSWORD: license
      POSTGRES_DB: license
    volumes:
      - teams-ai-license:/var/lib/postgresql/data
      - ./license/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U license -d license']
      interval: 5s
      timeout: 5s
      retries: 20

  license:
    build:
      context: ./license
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8790:8080'
    env_file:
      - ./license/.env
    environment:
      DATABASE_URL: postgres://license:license@postgres:5432/license?sslmode=disable
      PORT: '8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  teams-ai-data:
    name: teams-ai-data
  teams-ai-claude:
  teams-ai-gh:
  dind-data:
  teams-ai-license:
    name: teams-ai-license
