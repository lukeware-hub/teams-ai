# LEGACY. The supported deployment is Kubernetes (deploy/k8s). This compose file is kept only for a
# quick local run of the backend and can no longer run Docker-based gates: the image runs as the
# non-root `node` user and the host Docker socket is deliberately not mounted (security audit H4).
services:
  backend:
    build: .
    image: teams-ai-backend:local
    ports:
      - '8787:8787'
    # The bwrap sandbox Claude Code uses for each agent step needs user namespaces, which Docker's
    # default seccomp/apparmor profiles block. See server/config/config.ts sandbox.enabled for the
    # alternative of turning the sandbox off instead of loosening the container.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    volumes:
      - teams-ai-config:/home/node/.teams-ai
      - teams-ai-claude:/home/node/.claude
      - teams-ai-gh:/home/node/.config/gh

volumes:
  teams-ai-config:
  teams-ai-claude:
  teams-ai-gh:
